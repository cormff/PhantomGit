name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please describe the problem you're trying to solve, not just the solution you have in mind — that helps us evaluate alternatives.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What pain point or limitation are you running into today?
      placeholder: "I have ~30 watched projects and the polling cycle takes too long to detect changes in any individual one..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How would you like to see this addressed?
      placeholder: "Add a file-watcher mode using the `watchdog` library that triggers snapshots within seconds of a file change..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any other approaches? Why did you reject them?
    validations:
      required: false

  - type: textarea
    id: extra-context
    attributes:
      label: Additional Context
      description: Screenshots, references, links to similar features in other tools, anything that helps.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Final Checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This feature would be useful to more than just my specific setup.
          required: true