name: Build

on:
  push:
    branches: [main, master]
    tags:
      - "v*"   # any tag like v1.0.0, v1.2.3, v2.0.0-beta1
  pull_request:
    branches: [main, master]
  workflow_dispatch:    # allow manual triggering from the Actions tab

permissions:
  contents: write   # required to create GitHub Releases on tag push

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: phantomgit
            asset_suffix: linux-x86_64
          - os: macos-14         # Apple Silicon
            artifact_name: phantomgit
            asset_suffix: macos-arm64
          - os: windows-latest
            artifact_name: phantomgit.exe
            asset_suffix: windows-x86_64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller>=6.0
          pip install -r requirements.txt
          # Install optional providers so the binary supports them out of the box
          pip install google-genai
          pip install watchdog

      - name: Inject release version (tag builds only)
        # Use sed for a simple, safe one-liner -- avoids all heredoc / bash
        # variable-expansion edge cases that a 'python - <<EOF' approach has.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Injecting version: ${VERSION}"
          # sed -i behaviour differs between GNU (Linux) and BSD (macOS):
          #   GNU:  sed -i 's/.../.../g' file
          #   BSD:  sed -i '' 's/.../.../g' file
          # The matrix already splits Linux vs macOS, so the runner-specific
          # flag is selected here.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/__version__ = \"[^\"]*\"/__version__ = \"${VERSION}\"/" install.py
          else
            sed -i "s/__version__ = \"[^\"]*\"/__version__ = \"${VERSION}\"/" install.py
          fi
          echo "Version after injection:"
          grep '^__version__' install.py

      - name: Build executable
        run: pyinstaller phantomgit.spec --clean --noconfirm

      - name: Smoke test (non-Windows)
        if: runner.os != 'Windows'
        run: |
          # Basic CLI sanity
          ./dist/${{ matrix.artifact_name }} --help
          ./dist/${{ matrix.artifact_name }} status --help
          ./dist/${{ matrix.artifact_name }} --version
          # Verify the frozen Main module is importable (catches the class of
          # error where main.py was not compiled into the binary correctly)
          ./dist/${{ matrix.artifact_name }} --service-check 2>&1 | grep -q "Main module OK" \
            || echo "[WARN] --service-check not available; skipping module probe"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          .\dist\${{ matrix.artifact_name }} --help
          .\dist\${{ matrix.artifact_name }} status --help
          .\dist\${{ matrix.artifact_name }} --version

      - name: Rename binary for release
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "dist/${{ matrix.artifact_name }}" "release/phantomgit-${{ matrix.asset_suffix }}.exe"
          else
            cp "dist/${{ matrix.artifact_name }}" "release/phantomgit-${{ matrix.asset_suffix }}"
            chmod +x "release/phantomgit-${{ matrix.asset_suffix }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantomgit-${{ matrix.asset_suffix }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only run for tag pushes that look like v1.2.3
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact directory
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          # Hash only the actual platform binaries, not SHA256SUMS.txt itself.
          # sha256sum on Linux outputs: "<hash>  <filename>" (two spaces).
          # We list files explicitly to make the content deterministic and to
          # avoid any race condition where SHA256SUMS.txt already exists.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' \
            | sort \
            | xargs sha256sum \
            | sed 's|^\./||' \
            > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt contents ---"
          cat SHA256SUMS.txt
          echo "--- Verification ---"
          sha256sum --check SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Installation

            Download the binary for your platform below, then:

            **Linux / macOS**:
            ```bash
            chmod +x phantomgit-<platform>
            ./phantomgit-<platform>
            ```

            **Windows**:
            Double-click `phantomgit-windows-x86_64.exe`, or run from a terminal.

            See `SHA256SUMS.txt` to verify download integrity.

            ---

            See [CHANGELOG.md](CHANGELOG.md) for full release notes.
